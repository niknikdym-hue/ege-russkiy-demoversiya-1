name: Russian language prelaunch fixes

on:
  push:
    branches:
      - fix/prelaunch-russian-v2-1
    paths:
      - scripts/extract_russian_pdf.py
      - .github/workflows/russian-prelaunch-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-criteria:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/prelaunch-russian-v2-1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: pip install pypdf
      - name: Extract official criteria
        run: python scripts/extract_russian_pdf.py
      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/russian_pdf_text.txt
          git commit -m "Extract Russian language FIPI criteria"
          git push origin HEAD:fix/prelaunch-russian-v2-1
